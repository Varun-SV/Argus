# Benchmark fixture project (bench/fixtures/desktop-project). Opened by the Python desktop
# app (argus-gui) for the Windows desktop baselines in bench/windows-baselines.md. The tests
# are assertion-only: no model call and no network access is made, so the provider entry
# below is never contacted. Knowledge is not configured (graph store off).
provider: ollama

providers:
  ollama:
    model: bench-unused
    base_url: http://127.0.0.1:9

budgets:
  time_minutes: 5
  max_tokens: null

execution:
  environment: local
