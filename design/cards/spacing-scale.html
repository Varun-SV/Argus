<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid. Dense by default; --space-1 … --space-16." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); }
  .item { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
  .bar { width: 100%; background: var(--brand); border-radius: var(--radius-xs); }
  .wrap { width: 36px; display:flex; justify-content:center; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="wrap"><div class="bar" style="height:4px"></div></div><div class="tok">1</div><div class="px">4</div></div>
    <div class="item"><div class="wrap"><div class="bar" style="height:8px"></div></div><div class="tok">2</div><div class="px">8</div></div>
    <div class="item"><div class="wrap"><div class="bar" style="height:12px"></div></div><div class="tok">3</div><div class="px">12</div></div>
    <div class="item"><div class="wrap"><div class="bar" style="height:16px"></div></div><div class="tok">4</div><div class="px">16</div></div>
    <div class="item"><div class="wrap"><div class="bar" style="height:24px"></div></div><div class="tok">6</div><div class="px">24</div></div>
    <div class="item"><div class="wrap"><div class="bar" style="height:32px"></div></div><div class="tok">8</div><div class="px">32</div></div>
    <div class="item"><div class="wrap"><div class="bar" style="height:48px"></div></div><div class="tok">12</div><div class="px">48</div></div>
    <div class="item"><div class="wrap"><div class="bar" style="height:64px"></div></div><div class="tok">16</div><div class="px">64</div></div>
  </div>
</body>
</html>
