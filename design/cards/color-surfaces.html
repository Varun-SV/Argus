<!-- @dsCard group="Colors" viewport="700x200" name="Surfaces & text" subtitle="Semantic layering from sunken app shell up to raised panels, with text roles." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-sunken); padding: var(--space-5); font-family: var(--font-sans); }
  .stack { background: var(--bg-app); border-radius: var(--radius-lg); padding: var(--space-4); }
  .surface { background: var(--bg-surface); border-radius: var(--radius-md); padding: var(--space-4); border: 1px solid var(--border-subtle); }
  .panel { background: var(--bg-panel); border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); display:flex; flex-direction: column; gap: 3px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .1em; }
  .p { color: var(--text-primary); font-size: var(--text-base); font-weight: 600; }
  .s { color: var(--text-secondary); font-size: var(--text-sm); }
  .m { color: var(--text-muted); font-size: var(--text-sm); }
  .f { color: var(--text-faint); font-size: var(--text-sm); }
  .b { color: var(--text-brand); font-size: var(--text-sm); font-weight: 600; }
  .tag { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); margin-bottom: var(--space-2); }
</style>
</head>
<body>
  <div class="stack">
    <div class="tag">--bg-app</div>
    <div class="surface">
      <div class="tag">--bg-surface</div>
      <div class="panel">
        <div class="tag">--bg-panel</div>
        <span class="p">Primary text — titles, values</span>
        <span class="s">Secondary text — supporting copy</span>
        <span class="m">Muted text — metadata, captions</span>
        <span class="f">Faint text — disabled, timestamps</span>
        <span class="b">Brand text — links &amp; emphasis</span>
      </div>
    </div>
  </div>
</body>
</html>
