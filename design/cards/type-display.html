<!-- @dsCard group="Type" viewport="700x190" name="Display — Space Grotesk" subtitle="Headlines, hero numbers, brand voice. Tight tracking, semibold/bold." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-display); }
  .big { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; color: var(--text-primary); line-height: 1; }
  .big em { font-style: normal; color: var(--brand); }
  .row { display: flex; align-items: baseline; gap: var(--space-5); margin-top: var(--space-4); }
  .row span { font-weight: 600; color: var(--text-secondary); letter-spacing: -0.015em; }
  .tok { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-faint); margin-top: var(--space-3); }
</style>
</head>
<body>
  <div class="big">Watch <em>everything</em>.</div>
  <div class="row">
    <span style="font-size:34px">Aa</span>
    <span style="font-size:24px">700 · 600 · 500</span>
    <span style="font-size:20px; font-family:var(--font-display)">Ag 0123456789</span>
  </div>
  <div class="tok">--font-display · "Space Grotesk"</div>
</body>
</html>
