<!-- @dsCard group="Type" viewport="700x200" name="UI / Body — IBM Plex Sans" subtitle="The interface workhorse. Labels, body copy, table data. 14px default." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .specimen { font-size: 22px; color: var(--text-primary); font-weight: 500; letter-spacing: -0.01em; }
  p { color: var(--text-secondary); font-size: var(--text-base); line-height: var(--leading-normal); max-width: 60ch; margin-top: var(--space-3); }
  .weights { display:flex; gap: var(--space-5); margin-top: var(--space-4); color: var(--text-secondary); font-size: var(--text-md); }
  .weights b { color: var(--text-primary); }
  .tok { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-faint); margin-top: var(--space-3); }
</style>
</head>
<body>
  <div class="specimen">The quick brown fox tests every interface.</div>
  <p>Argus runs hybrid-agentic tests across desktop, browser, CLI and TUI targets — observing each app the way a person would, then validating against your authoritative assertions.</p>
  <div class="weights"><span style="font-weight:400">Regular 400</span><span style="font-weight:500">Medium 500</span><b style="font-weight:600">Semibold 600</b><b style="font-weight:700">Bold 700</b></div>
  <div class="tok">--font-sans · "IBM Plex Sans"</div>
</body>
</html>
