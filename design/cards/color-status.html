<!-- @dsCard group="Colors" viewport="700x210" name="Test status" subtitle="The semantic heart of Argus — every run outcome maps to one of these." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
  .item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .label { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .pill { margin-left: auto; font-family: var(--font-mono); font-size: 10px; padding: 2px 7px; border-radius: var(--radius-pill); font-weight: 600; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item" style="background:var(--status-pass-tint)"><span class="dot" style="background:var(--status-pass)"></span><div><div class="label">Pass</div><div class="tok">--status-pass</div></div></div>
    <div class="item" style="background:var(--status-fail-tint)"><span class="dot" style="background:var(--status-fail)"></span><div><div class="label">Fail</div><div class="tok">--status-fail</div></div></div>
    <div class="item" style="background:var(--status-error-tint)"><span class="dot" style="background:var(--status-error)"></span><div><div class="label">Error</div><div class="tok">--status-error</div></div></div>
    <div class="item" style="background:var(--status-running-tint)"><span class="dot" style="background:var(--status-running)"></span><div><div class="label">Running</div><div class="tok">--status-running</div></div></div>
    <div class="item" style="background:var(--status-flaky-tint)"><span class="dot" style="background:var(--status-flaky)"></span><div><div class="label">Flaky</div><div class="tok">--status-flaky</div></div></div>
    <div class="item" style="background:var(--status-skipped-tint)"><span class="dot" style="background:var(--status-skipped)"></span><div><div class="label">Skipped</div><div class="tok">--status-skipped</div></div></div>
  </div>
</body>
</html>
