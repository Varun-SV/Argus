<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="Tight, technical corners. xs 3 → lg 10 for panels → pill." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .row { display: flex; gap: var(--space-4); align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
  .box { width: 64px; height: 64px; background: var(--bg-raised); border: 1.5px solid var(--border-strong); border-top: 2px solid var(--brand); border-right: 2px solid var(--brand); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="tok">xs</div><div class="px">3px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="tok">sm</div><div class="px">5px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="tok">md</div><div class="px">7px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="tok">lg</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="tok">xl</div><div class="px">14px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="tok">2xl</div><div class="px">20px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="tok">pill</div><div class="px">999</div></div>
  </div>
</body>
</html>
