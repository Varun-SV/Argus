<!-- @dsCard group="Colors" viewport="700x196" name="Accent — Beacon" subtitle="Amber accent. The watchman's lantern — highlights, warnings, focus pulls." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .row { display: flex; gap: var(--space-2); }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 56px; }
  .meta { padding: var(--space-2) var(--space-2-5); background: var(--bg-raised); }
  .name { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .lead { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-4); }
  .lead b { font-family: var(--font-display); font-size: var(--text-xl); color: var(--text-primary); font-weight: 600; }
  .lead .tok { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--accent); }
</style>
</head>
<body>
  <div class="lead"><b>Beacon</b><span class="tok">--accent · --beacon-500</span></div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--beacon-200)"></div><div class="meta"><div class="name">200</div><div class="hex">#ffe0a3</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--beacon-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#ffd27a</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--beacon-400)"></div><div class="meta"><div class="name">400</div><div class="hex">#ffc24d</div></div></div>
    <div class="sw" style="border-color:var(--beacon-500)"><div class="chip" style="background:var(--beacon-500)"></div><div class="meta"><div class="name">★ 500</div><div class="hex">#ffae1a</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--beacon-600)"></div><div class="meta"><div class="name">600</div><div class="hex">#e08c00</div></div></div>
  </div>
</body>
</html>
