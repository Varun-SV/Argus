<!-- @dsCard group="Type" viewport="700x220" name="Mono & syntax — IBM Plex Mono" subtitle="Selectors, durations, test IDs, YAML, logs. Carries all machine data." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-sunken); padding: var(--space-6); font-family: var(--font-mono); }
  pre { margin: 0; font-family: var(--font-mono); font-size: var(--text-sm); line-height: var(--leading-code); }
  .k { color: var(--syntax-key); }
  .s { color: var(--syntax-string); }
  .n { color: var(--syntax-number); }
  .c { color: var(--syntax-comment); }
  .kw { color: var(--syntax-keyword); }
  .p { color: var(--syntax-punct); }
  .tok { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-faint); margin-top: var(--space-4); }
</style>
</head>
<body>
<pre><span class="c"># .argus/login.test.yaml</span>
<span class="k">target</span><span class="p">:</span>
  <span class="k">adapter</span><span class="p">:</span> <span class="s">browser</span>
  <span class="k">launch</span><span class="p">:</span> <span class="s">"https://app.example.com"</span>
<span class="k">steps</span><span class="p">:</span>
  <span class="p">-</span> <span class="s">"Log in with test credentials"</span>   <span class="c"># 1.84s</span>
<span class="k">assert</span><span class="p">:</span>
  <span class="k">visible</span><span class="p">:</span> <span class="s">"Dashboard"</span>
  <span class="k">url_contains</span><span class="p">:</span> <span class="s">"/home"</span>
  <span class="k">exit_code</span><span class="p">:</span> <span class="n">0</span></pre>
  <div class="tok">--font-mono · "IBM Plex Mono" · zero 1</div>
</body>
</html>
