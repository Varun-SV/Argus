<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="11 → 80px modular ramp, tuned for instrument density." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .line { display: flex; align-items: baseline; gap: var(--space-4); padding: var(--space-1) 0; border-bottom: 1px solid var(--border-subtle); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); width: 130px; flex: none; }
  .samp { color: var(--text-primary); font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="line"><span class="tok">5xl · 48px</span><span class="samp" style="font-size:48px">Argus</span></div>
  <div class="line"><span class="tok">3xl · 30px</span><span class="samp" style="font-size:30px">Run detail</span></div>
  <div class="line"><span class="tok">2xl · 24px</span><span class="samp" style="font-size:24px">Test suite passed</span></div>
  <div class="line"><span class="tok">xl · 20px</span><span class="samp" style="font-size:20px">Provider configuration</span></div>
  <div class="line"><span class="tok">lg · 17px</span><span class="samp" style="font-size:17px">Step timeline &amp; assertions</span></div>
  <div class="line"><span class="tok">base · 14px</span><span class="samp" style="font-size:14px;font-family:var(--font-sans);font-weight:400">Default interface body text</span></div>
  <div class="line"><span class="tok">xs · 12px</span><span class="samp" style="font-size:12px;font-family:var(--font-mono);font-weight:400;color:var(--text-muted)">desktop-gui · 1.84s · exit 0</span></div>
</body>
</html>
