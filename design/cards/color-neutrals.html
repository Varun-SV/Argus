<!-- @dsCard group="Colors" viewport="700x232" name="Neutrals — Slate" subtitle="Cool ink ramp, 1000 → 50. App background through to primary text." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .lead { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-4); }
  .lead b { font-family: var(--font-display); font-size: var(--text-xl); color: var(--text-primary); font-weight: 600; }
  .lead .tok { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); }
  .row { display: flex; gap: var(--space-1); }
  .sw { flex: 1; }
  .chip { height: 48px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .name { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); margin-top: var(--space-1-5); text-align: center; }
  .hex { font-family: var(--font-mono); font-size: 8.5px; color: var(--text-faint); opacity:.7; text-align: center; }
</style>
</head>
<body>
  <div class="lead"><b>Slate</b><span class="tok">--bg-app / --bg-surface / --text-primary …</span></div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--slate-1000)"></div><div class="name">1000</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-950)"></div><div class="name">950</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-900)"></div><div class="name">900</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-850)"></div><div class="name">850</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-800)"></div><div class="name">800</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-700)"></div><div class="name">700</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-600)"></div><div class="name">600</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-500)"></div><div class="name">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-400)"></div><div class="name">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-300)"></div><div class="name">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-200)"></div><div class="name">200</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-100)"></div><div class="name">100</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-50)"></div><div class="name">50</div></div>
  </div>
</body>
</html>
