<!-- @dsCard group="Components" viewport="700x240" name="Progress & Tooltip" subtitle="Determinate, running, and segmented pass/fail bars + hover tooltip." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: var(--space-5); }
  .item { display: flex; flex-direction: column; gap: var(--space-2); }
  .lab { display:flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .row { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-2); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { ProgressBar, Tooltip, IconButton, Button } = window.ArgusDesignSystem_e0a29b;
  const Refresh = () => <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>;
  function Demo() {
    return (
      <div className="stack">
        <div className="item"><div className="lab"><span>suite · login.test.yaml</span><span>72%</span></div><ProgressBar value={72}/></div>
        <div className="item"><div className="lab"><span>running · checkout.test.yaml</span><span>step 6 / 9</span></div><ProgressBar running/></div>
        <div className="item"><div className="lab"><span>128 tests</span><span>118 · 6 · 1 · 3</span></div>
          <ProgressBar segments={[{kind:'pass',value:118},{kind:'fail',value:6},{kind:'error',value:1},{kind:'skip',value:3}]}/></div>
        <div className="row">
          <Tooltip content="Re-run this test" kbd="⌘R"><IconButton variant="solid" label="Re-run"><Refresh/></IconButton></Tooltip>
          <Tooltip content="Hover anything that needs explaining"><Button variant="secondary" size="sm">Hover me</Button></Tooltip>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
