<!-- @dsCard group="Components" viewport="700x300" name="Buttons" subtitle="Button variants, sizes, icon & loading states + IconButton toolbar." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: var(--space-5); }
  .row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .1em; width: 100%; }
  .bar { display: inline-flex; gap: 2px; padding: 4px; background: var(--bg-inset); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton } = window.ArgusDesignSystem_e0a29b;
  const I = ({d, fill}) => <svg viewBox="0 0 24 24" fill={fill||"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
  const Play = () => <I fill="currentColor" d={<polygon points="6 4 20 12 6 20 6 4"/>} />;
  const Plus = () => <I d={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
  const Refresh = () => <I d={<><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></>} />;
  const Filter = () => <I d={<polygon points="22 3 2 3 10 12.5 10 19 14 21 14 12.5 22 3"/>} />;
  const Trash = () => <I d={<><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></>} />;

  function Demo() {
    return (
      <div className="stack">
        <div className="row">
          <span className="cap">Variants</span>
          <Button variant="primary" leftIcon={<Play/>}>Run test</Button>
          <Button variant="secondary">Edit YAML</Button>
          <Button variant="ghost">Cancel</Button>
          <Button variant="danger" leftIcon={<Trash/>}>Delete</Button>
        </div>
        <div className="row">
          <span className="cap">Sizes &amp; states</span>
          <Button size="lg" variant="primary" leftIcon={<Plus/>}>New suite</Button>
          <Button size="md" variant="secondary">Default</Button>
          <Button size="sm" variant="secondary">Small</Button>
          <Button variant="primary" loading>Running</Button>
          <Button variant="secondary" disabled>Disabled</Button>
        </div>
        <div className="row">
          <span className="cap">IconButton</span>
          <div className="bar">
            <IconButton active label="Run"><Play/></IconButton>
            <IconButton label="Re-run"><Refresh/></IconButton>
            <IconButton label="Filter"><Filter/></IconButton>
            <IconButton label="Delete"><Trash/></IconButton>
          </div>
          <IconButton variant="solid" label="Add"><Plus/></IconButton>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
