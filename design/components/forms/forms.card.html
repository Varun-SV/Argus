<!-- @dsCard group="Components" viewport="700x300" name="Forms" subtitle="Input (icon/error), Select, Switch and Checkbox controls." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5) var(--space-6); align-items: start; }
  .col { display: flex; flex-direction: column; gap: var(--space-4); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Select, Switch, Checkbox } = window.ArgusDesignSystem_e0a29b;
  const Globe = () => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>;
  function Demo() {
    const [a,setA]=React.useState(true), [b,setB]=React.useState(false), [c,setC]=React.useState(true);
    return (
      <div className="grid">
        <div className="col">
          <Input label="Launch URL" mono leadingIcon={<Globe/>} defaultValue="https://app.example.com" />
          <Input label="API key" type="password" required error="Required for OpenAI provider" defaultValue="sk-..." />
        </div>
        <div className="col">
          <Select label="Provider" options={[
            {value:"anthropic",label:"Anthropic — Claude 3.5 Sonnet"},
            {value:"openai",label:"OpenAI — GPT-4o"},
            {value:"ollama",label:"Ollama — LLaVA (local)"},
          ]} />
          <div className="col" style={{gap:'var(--space-3)'}}>
            <Switch label="Watch mode" checked={a} onChange={e=>setA(e.target.checked)} />
            <Switch label="Headless" checked={b} onChange={e=>setB(e.target.checked)} />
            <Checkbox label="Emit JUnit XML" checked={c} onChange={e=>setC(e.target.checked)} />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
