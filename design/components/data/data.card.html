<!-- @dsCard group="Components" viewport="700x230" name="Status, Badge & Tag" subtitle="Test-outcome badges, count badges, and adapter/provider chips." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: var(--space-5); }
  .row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .1em; width: 100%; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { StatusBadge, Badge, Tag } = window.ArgusDesignSystem_e0a29b;
  const Bolt = () => <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
  function Demo() {
    return (
      <div className="stack">
        <div className="row"><span className="cap">StatusBadge</span>
          <StatusBadge status="pass"/><StatusBadge status="fail"/><StatusBadge status="error"/>
          <StatusBadge status="running"/><StatusBadge status="flaky" label="Flaky · 2/5"/><StatusBadge status="skipped"/>
        </div>
        <div className="row"><span className="cap">Badge</span>
          <Badge>128</Badge><Badge variant="brand">12 new</Badge><Badge variant="accent">3 flaky</Badge><Badge variant="solid">v0.4</Badge>
        </div>
        <div className="row"><span className="cap">Tag — adapters &amp; providers</span>
          <Tag dotColor="var(--signal-500)">browser</Tag>
          <Tag dotColor="var(--beacon-500)">desktop-gui</Tag>
          <Tag dotColor="var(--violet-500)">cli</Tag>
          <Tag icon={<Bolt/>}>gpt-4o</Tag>
          <Tag interactive onRemove={()=>{}}>env:staging</Tag>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
