<!-- @dsCard group="Components" viewport="700x300" name="Card & Tabs" subtitle="Surface container with header/body/footer, plus underline and pill tabs." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-panel); padding: var(--space-6); font-family: var(--font-sans); }
  .wrap { display: flex; flex-direction: column; gap: var(--space-5); }
  .tabsrow { display: flex; gap: var(--space-6); align-items: center; flex-wrap: wrap; }
  .body-row { display:flex; align-items:center; gap: var(--space-3); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Card, Tabs, StatusBadge, Tag, IconButton } = window.ArgusDesignSystem_e0a29b;
  const Dots = () => <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>;
  function Demo() {
    const [tab,setTab]=React.useState("steps");
    const [env,setEnv]=React.useState("staging");
    return (
      <div className="wrap">
        <Card>
          <Card.Header title="checkout.test.yaml" actions={<><StatusBadge status="pass"/><IconButton label="More"><Dots/></IconButton></>} />
          <Card.Body>
            <div className="body-row">
              <Tag dotColor="var(--signal-500)">browser</Tag>
              <Tag>gemini-2.0-flash</Tag>
              <span style={{color:'var(--text-muted)',fontFamily:'var(--font-mono)',fontSize:12}}>9 steps · 4.18s</span>
            </div>
          </Card.Body>
          <Card.Footer><span style={{color:'var(--text-faint)',fontFamily:'var(--font-mono)',fontSize:11}}>last run 2m ago · exit 0</span></Card.Footer>
        </Card>
        <div className="tabsrow">
          <Tabs value={tab} onChange={setTab} items={[{id:"steps",label:"Steps",count:9},{id:"logs",label:"Logs"},{id:"yaml",label:"YAML"}]} />
          <Tabs variant="pills" value={env} onChange={setEnv} items={[{id:"all",label:"All"},{id:"staging",label:"Staging"},{id:"prod",label:"Prod"}]} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
