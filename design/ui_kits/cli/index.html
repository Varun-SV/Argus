<!-- @dsCard group="CLI" viewport="1180x720" name="CLI / Terminal" subtitle="The argus CLI — streamed `argus run` output with colored pass/fail and a command rail." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus CLI</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-sunken); color: var(--text-primary); }
  .ic { display: inline-flex; align-items: center; justify-content: center; line-height: 0; flex: none; }
  svg.lucide { width: 1em; height: 1em; }
  .mono { font-family: var(--font-mono); }

  .cli { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  /* Command rail */
  .rail { background: var(--bg-surface); border-right: 1px solid var(--border-subtle); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); overflow-y: auto; }
  .rail__head { display: flex; align-items: center; gap: var(--space-2); }
  .rail__head span:first-of-type { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); }
  .rail__v { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); padding: 2px 8px; }
  .rail__lead { font-size: var(--text-sm); color: var(--text-muted); line-height: var(--leading-normal); margin: 0; }
  .rail__lead .mono { color: var(--text-secondary); background: var(--bg-inset); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .rail__cmds { display: flex; flex-direction: column; gap: 2px; }
  .rail__cmd { display: flex; flex-direction: column; gap: 2px; padding: var(--space-2-5); border-radius: var(--radius-md); border: 1px solid transparent; transition: var(--transition-colors); cursor: default; }
  .rail__cmd:hover { background: var(--bg-hover); border-color: var(--border-subtle); }
  .rail__cmd code { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-brand); font-weight: 500; }
  .rail__cmd span { font-size: var(--text-xs); color: var(--text-muted); }
  .rail__env { margin-top: auto; display: flex; flex-direction: column; gap: 5px; padding: var(--space-3); background: var(--bg-inset); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
  .rail__env-title { font-size: 10px; letter-spacing: 0.12em; color: var(--text-faint); font-weight: 600; margin-bottom: 2px; }
  .rail__env code { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }

  /* Terminal */
  .cli__main { padding: var(--space-7); display: flex; align-items: stretch; min-height: 0; }
  .term { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--slate-1000); border: 1px solid var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
  .term__chrome { display: flex; align-items: center; gap: var(--space-3); height: 40px; padding: 0 var(--space-4); background: var(--slate-850); border-bottom: 1px solid var(--border-subtle); }
  .term__dots { display: inline-flex; gap: 7px; }
  .term__dots i { width: 11px; height: 11px; border-radius: 50%; }
  .term__dots i:nth-child(1){ background:#ff5f57;} .term__dots i:nth-child(2){ background:#febc2e;} .term__dots i:nth-child(3){ background:#28c840;}
  .term__title { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }
  .term__replay { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 var(--space-2-5); border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-raised); color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px; cursor: pointer; transition: var(--transition-colors); }
  .term__replay:hover { color: var(--text-primary); border-color: var(--border-strong); }
  .term__body { flex: 1; overflow-y: auto; padding: var(--space-4) var(--space-5); font-family: var(--font-mono); font-size: 13px; line-height: 1.62; }

  .tl { white-space: pre-wrap; }
  .t-prompt { color: var(--signal-400); font-weight: 600; }
  .t-banner { color: var(--text-secondary); margin: 2px 0 6px; }
  .t-dim { color: var(--text-faint); }
  .t-bin { color: var(--signal-400); font-weight: 600; }
  .t-sub { color: var(--text-primary); }
  .t-flag { color: var(--violet-400); }
  .t-path, .t-arg { color: var(--beacon-300); }
  .t-link { color: var(--signal-300); text-decoration: underline; }

  .tl-step { display: flex; align-items: baseline; gap: var(--space-2); }
  .t-g { width: 12px; flex: none; font-weight: 700; }
  .t-pass { color: var(--green-400); } .t-fail { color: var(--red-400); } .t-skip { color: var(--text-faint); }
  .t-n { width: 38px; flex: none; color: var(--text-faint); font-size: 11px; }
  .t-step-text { flex: 1; color: var(--text-primary); }
  .t-assert { color: var(--text-secondary); }
  .t-dur { color: var(--text-faint); font-size: 11px; }
  .tl-note { padding-left: 54px; }
  .tl-diff { padding-left: 54px; margin: 1px 0 3px; }
  .t-str { color: var(--beacon-300); } .t-num { color: var(--violet-400); }
  .t-rule { color: var(--text-faint); letter-spacing: 1px; }
  .tl-summary { margin: 2px 0; font-weight: 500; }
  .term__cursor { display: inline-block; width: 8px; height: 15px; background: var(--signal-400); vertical-align: text-bottom; animation: argus-pulse 1s steps(2) infinite; }
</style>
</head>
<body>
<div id="root"></div>

</html>
