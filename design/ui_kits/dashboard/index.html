<!-- @dsCard group="Dashboard" viewport="1280x1180" name="Web Dashboard" subtitle="Self-hosted dashboard — KPIs, pass/fail trend, flakiness tracking, run history." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-app); color: var(--text-primary); }
  .ic { display: inline-flex; align-items: center; justify-content: center; line-height: 0; flex: none; }
  svg.lucide { width: 1em; height: 1em; }
  .mono { font-family: var(--font-mono); }
  .num { text-align: right; }

  /* Top nav */
  .dnav { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--space-6); height: 60px; padding: 0 var(--space-7); background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); }
  .dnav__brand { display: flex; align-items: center; gap: var(--space-2); }
  .dnav__name { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); letter-spacing: -0.01em; }
  .dnav__sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); padding: 2px 7px; border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); }
  .dnav__tabs { display: flex; gap: var(--space-1); }
  .dnav__tab { height: 32px; padding: 0 var(--space-3); border: none; background: none; border-radius: var(--radius-md); color: var(--text-muted); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: var(--transition-colors); }
  .dnav__tab:hover { color: var(--text-primary); background: var(--bg-hover); }
  .dnav__tab.is-active { color: var(--text-primary); background: var(--bg-raised); }
  .dnav__right { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); }
  .dnav__search { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-inset); color: var(--text-faint); font-size: var(--text-xs); cursor: text; min-width: 180px; }
  .dnav__env { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--space-2-5); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); color: var(--text-secondary); font-family: var(--font-mono); font-size: var(--text-xs); cursor: pointer; }
  .dnav__avatar { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--brand-tint); color: var(--text-brand); font-size: 11px; font-weight: 700; font-family: var(--font-mono); }

  /* Layout */
  .dash__main { max-width: var(--content-max); margin: 0 auto; padding: var(--space-7); }
  .dash__head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-6); }
  .dash__head h1 { font-size: var(--text-3xl); font-weight: 600; letter-spacing: -0.02em; }
  .dash__sub { color: var(--text-muted); font-size: var(--text-sm); margin-top: 4px; font-family: var(--font-mono); }
  .dash__head-actions { display: flex; gap: var(--space-2); }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); margin-bottom: var(--space-5); }
  .kpi { padding: var(--space-4) var(--space-5); background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
  .kpi__top { display: flex; align-items: center; gap: var(--space-2); color: var(--text-muted); }
  .kpi__icon { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: var(--radius-sm); background: var(--bg-inset); color: var(--text-brand); }
  .kpi__label { font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi__value { font-family: var(--font-display); font-size: var(--text-4xl); font-weight: 600; letter-spacing: -0.02em; margin: var(--space-2) 0 var(--space-1); }
  .kpi__delta { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 600; }
  .kpi__delta--up { color: var(--status-pass); } .kpi__delta--down { color: var(--status-fail); }
  .kpi__delta-note { color: var(--text-faint); font-weight: 400; margin-left: 4px; }

  /* Panels */
  .card-panel { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); }
  .panel-title { font-family: var(--font-display); font-size: var(--text-md); font-weight: 600; }
  .panel-sub { display: block; font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
  .panel-link { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-xs); font-weight: 600; color: var(--text-brand); cursor: pointer; }

  .dash__grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-5); }

  /* Trend chart */
  .trend__legend { display: flex; gap: var(--space-3); font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .trend__legend span { display: inline-flex; align-items: center; gap: 5px; }
  .lg { width: 9px; height: 9px; border-radius: 2px; } .lg--pass { background: var(--status-pass); } .lg--fail { background: var(--status-fail); }
  .trend__plot { position: relative; padding: var(--space-5); height: 200px; }
  .trend__grid { position: absolute; left: var(--space-5); right: var(--space-5); border-top: 1px dashed var(--border-subtle); }
  .trend__bars { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 100%; }
  .trend__col { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .trend__stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; border-radius: 3px 3px 0 0; overflow: hidden; min-height: 4px; }
  .trend__pass { background: var(--status-pass); } .trend__fail { background: var(--status-fail); min-height: 2px; }
  .trend__col:hover .trend__pass { background: var(--green-400); }

  /* Flaky table */
  .ftable { padding: var(--space-2) var(--space-3); }
  .frow { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: var(--space-3); padding: var(--space-2-5) var(--space-2); border-radius: var(--radius-sm); }
  .frow:hover { background: var(--bg-hover); }
  .frow__dot { width: 7px; height: 7px; border-radius: 2px; }
  .frow__name { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spark { display: inline-flex; gap: 2px; }
  .spark__c { width: 7px; height: 16px; border-radius: 1.5px; }
  .spark__c--pass { background: var(--status-pass); opacity: .85; } .spark__c--fail { background: var(--status-fail); } .spark__c--skip { background: var(--slate-600); }
  .frow__score { display: inline-flex; align-items: center; gap: var(--space-2); width: 110px; }
  .frow__bar { flex: 1; height: 5px; background: var(--bg-inset); border-radius: var(--radius-pill); overflow: hidden; }
  .frow__bar span { display: block; height: 100%; background: var(--status-flaky); }
  .frow__pct { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 30px; text-align: right; }

  /* Runs table */
  .rtable { padding: var(--space-2) var(--space-3) var(--space-3); }
  .rtable__head, .rrow { display: grid; grid-template-columns: 64px 96px 1.6fr 130px 56px 1.2fr 80px 76px; align-items: center; gap: var(--space-3); }
  .rtable__head { padding: var(--space-2) var(--space-2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 600; border-bottom: 1px solid var(--border-subtle); }
  .rrow { padding: var(--space-2-5) var(--space-2); border-radius: var(--radius-sm); font-size: var(--text-sm); }
  .rrow:hover { background: var(--bg-hover); }
  .rrow__id { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-faint); }
  .rrow__name { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow__steps { color: var(--text-secondary); } .rrow__prov { font-size: var(--text-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow__when { font-size: var(--text-xs); color: var(--text-faint); }
  .rtable .num { justify-self: end; }
  .rtable__head .num { text-align: right; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</html>
