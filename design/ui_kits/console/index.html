<!-- @dsCard group="Console" viewport="1320x840" name="Desktop Console" subtitle="The Tauri desktop app — run detail, screenshot timeline, YAML editor, providers." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Console</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-sunken); overflow: hidden; }
  .ic { display: inline-flex; align-items: center; justify-content: center; line-height: 0; flex: none; }
  svg.lucide { width: 1em; height: 1em; }
  code, .mono { font-family: var(--font-mono); }

  /* ---------- App shell ---------- */
  .ds-app { display: grid; grid-template-rows: var(--topbar-height) 1fr var(--statusbar-height); height: 100vh; background: var(--bg-app); color: var(--text-primary); }
  .workbench { display: flex; min-height: 0; overflow: hidden; }
  .main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg-app); }

  /* ---------- Titlebar ---------- */
  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 0 var(--space-3) 0 var(--space-4); background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); }
  .titlebar__left, .titlebar__right { display: flex; align-items: center; gap: var(--space-3); }
  .win-dots { display: inline-flex; gap: 7px; margin-right: var(--space-2); }
  .win-dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--slate-600); }
  .win-dots i:nth-child(1){ background:#ff5f57; } .win-dots i:nth-child(2){ background:#febc2e; } .win-dots i:nth-child(3){ background:#28c840; }
  .brand { display: inline-flex; align-items: center; gap: var(--space-2); }
  .brand__name { font-family: var(--font-display); font-weight: 600; font-size: var(--text-md); letter-spacing: -0.01em; }
  .proj { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--space-2-5); border-radius: var(--radius-md); background: var(--bg-inset); border: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: var(--text-xs); font-family: var(--font-mono); cursor: pointer; }
  .proj:hover { border-color: var(--border-default); }

  .viewnav { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg-inset); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .viewnav__tab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--space-3); border: none; background: none; border-radius: var(--radius-sm); color: var(--text-muted); font-family: var(--font-sans); font-size: var(--text-xs); font-weight: 600; cursor: pointer; transition: var(--transition-colors); }
  .viewnav__tab:hover { color: var(--text-primary); }
  .viewnav__tab.is-active { background: var(--bg-raised); color: var(--text-primary); box-shadow: var(--shadow-xs); }
  .watch { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--space-2-5); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-inset); color: var(--text-muted); font-size: var(--text-xs); font-family: var(--font-mono); cursor: pointer; transition: var(--transition-colors); }
  .watch.is-on { color: var(--text-brand); border-color: rgba(31,224,193,0.3); background: var(--brand-tint); }

  /* ---------- Sidebar ---------- */
  .sidebar { width: var(--rail-sidebar); flex: none; display: flex; flex-direction: column; background: var(--bg-surface); border-right: 1px solid var(--border-subtle); min-height: 0; }
  .sidebar__search { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); }
  .sidebar__input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text-primary); font-family: var(--font-sans); font-size: var(--text-sm); }
  .sidebar__input::placeholder { color: var(--text-faint); }
  .sidebar__kbd { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); border: 1px solid var(--border-default); border-radius: 4px; padding: 1px 5px; }
  .sidebar__scroll { flex: 1; overflow-y: auto; padding: var(--space-2); }
  .tree__group { margin-bottom: var(--space-2); }
  .tree__suite { display: flex; align-items: center; gap: 6px; padding: var(--space-1-5) var(--space-2); color: var(--text-muted); font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .tree__suite .ic:first-child { color: var(--text-faint); }
  .tree__count { margin-left: auto; font-family: var(--font-mono); font-weight: 500; color: var(--text-faint); }
  .tree__test { display: flex; align-items: center; gap: var(--space-2); width: 100%; padding: var(--space-1-5) var(--space-2); padding-left: var(--space-4); border: none; background: none; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-secondary); font-family: var(--font-mono); font-size: var(--text-xs); transition: var(--transition-colors); }
  .tree__test:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tree__test.is-active { background: var(--bg-selected); color: var(--text-primary); }
  .tree__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .tree__flaky { color: var(--status-flaky); }
  .tree__dur { color: var(--text-faint); font-size: 10px; }
  .sidebar__legend { border-top: 1px solid var(--border-subtle); padding: var(--space-3); }
  .legend__title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint); font-weight: 600; }
  .legend__chips { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: var(--space-2); }
  .legend__chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .legend__dot { width: 7px; height: 7px; border-radius: 2px; }

  /* ---------- Status dots ---------- */
  .sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .sdot--pass{ background: var(--status-pass);} .sdot--fail{ background: var(--status-fail);} .sdot--error{ background: var(--status-error);}
  .sdot--skipped,.sdot--pending{ background: var(--text-faint);} .sdot--flaky{ background: var(--status-flaky);}
  .sdot--running{ background: var(--status-running); animation: argus-pulse 1.3s var(--ease-inout) infinite; }

  /* ---------- Run detail ---------- */
  .run { display: flex; flex-direction: column; }
  .run-head { padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; background: var(--bg-app); z-index: 5; }
  .run-head__top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
  .run-head__title { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .run-head__title .ic { color: var(--text-muted); }
  .run-head__title h2 { font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .run-head__actions { display: flex; align-items: center; gap: var(--space-2); }
  .run-head__meta { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-3); flex-wrap: wrap; }
  .run-head__stat { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); }
  .run-head__stat .ic { color: var(--text-muted); }
  .run-head__stat--muted { color: var(--text-faint); margin-left: auto; }
  .run-head__bar { margin-top: var(--space-3); }

  .run__stage { padding: var(--space-5) var(--space-6); display: grid; grid-template-columns: 1fr; gap: var(--space-3); }

  /* Captured frame */
  .frame { position: relative; background: var(--slate-1000); border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); }
  .frame__chrome { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 var(--space-3); background: var(--slate-850); border-bottom: 1px solid var(--border-subtle); }
  .frame__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--slate-600); }
  .frame__url { margin-left: var(--space-3); font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .frame__body { padding: var(--space-5); }
  .frame--big .frame__body { min-height: 280px; }
  .wf { background: var(--slate-750); border-radius: var(--radius-xs); }
  .wf--bar { height: 14px; width: 38%; margin-bottom: var(--space-5); }
  .wf-row { display: flex; gap: var(--space-5); }
  .wf--side { width: 120px; height: 200px; flex: none; }
  .wf-main { flex: 1; }
  .wf--h { height: 22px; width: 55%; margin-bottom: var(--space-4); background: var(--slate-700); }
  .wf--p { height: 11px; width: 90%; margin-bottom: var(--space-2-5); }
  .wf--p.short { width: 64%; }
  .frame__target { position: relative; margin-top: var(--space-5); padding: var(--space-4); border: 2px solid var(--status-pass); border-radius: var(--radius-md); width: 60%; }
  .frame__target-label { position: absolute; top: -10px; left: 10px; padding: 1px 8px; border-radius: var(--radius-pill); font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--slate-1000); }
  .wf--btn { height: 30px; width: 130px; background: var(--slate-600); border-radius: var(--radius-sm); }
  .frame__caption { position: absolute; bottom: var(--space-3); right: var(--space-3); font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); background: var(--bg-overlay); padding: 2px 8px; border-radius: var(--radius-sm); backdrop-filter: blur(4px); }
  .frame__reticle { position: absolute; width: 16px; height: 16px; border: 2px solid var(--signal-500); opacity: .6; }
  .frame__reticle--tl { top: 38px; left: 10px; border-right: none; border-bottom: none; }
  .frame__reticle--br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  /* Filmstrip */
  .filmstrip { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-1); }
  .filmstrip__item { flex: none; border: none; background: none; padding: 0; cursor: pointer; }
  .filmstrip__thumb { position: relative; display: flex; align-items: center; justify-content: center; width: 72px; height: 46px; background: var(--slate-850); border: 1.5px solid var(--border-default); border-radius: var(--radius-sm); transition: var(--transition-colors); }
  .filmstrip__item:hover .filmstrip__thumb { border-color: var(--border-strong); }
  .filmstrip__item.is-active .filmstrip__thumb { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-tint); }
  .filmstrip__frame { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }
  .filmstrip__badge { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; }

  /* Steps */
  .run__steps { padding: 0 var(--space-6) var(--space-8); }
  .run__steps-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-2); color: var(--text-muted); font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .run__steps-count { font-family: var(--font-mono); color: var(--text-faint); text-transform: none; letter-spacing: 0; }
  .step { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-2-5) var(--space-3); border: 1px solid transparent; border-radius: var(--radius-md); background: none; cursor: pointer; text-align: left; transition: var(--transition-colors); }
  .step:hover { background: var(--bg-hover); }
  .step.is-active { background: var(--bg-raised); border-color: var(--border-default); }
  .step--fail.is-active { border-color: rgba(245,73,79,0.4); }
  .step__n { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); width: 18px; }
  .step__icon { color: var(--text-muted); display: inline-flex; }
  .step__text { flex: 1; min-width: 0; color: var(--text-primary); font-size: var(--text-sm); display: flex; align-items: center; gap: var(--space-2); }
  .step__assert { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); background: var(--bg-inset); padding: 2px 7px; border-radius: var(--radius-xs); }
  .step__kind { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .step__dur { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }

  /* ---------- Inspector ---------- */
  .inspector { width: var(--rail-inspector); flex: none; display: flex; flex-direction: column; background: var(--bg-surface); border-left: 1px solid var(--border-subtle); min-height: 0; }
  .inspector__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
  .inspector__kind { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
  .inspector__title { padding: var(--space-4); font-size: var(--text-md); font-weight: 500; color: var(--text-primary); border-bottom: 1px solid var(--border-subtle); }
  .inspector__title code { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-brand); }
  .inspector__scroll { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-5); }
  .insp-block__label { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); margin-bottom: var(--space-2); white-space: nowrap; }
  .insp-block__label .ic { color: var(--text-brand); }
  .insp-block__body { font-size: var(--text-sm); color: var(--text-secondary); line-height: var(--leading-normal); }
  .insp-block__body--quote { padding: var(--space-2-5) var(--space-3); background: var(--bg-inset); border-left: 2px solid var(--brand); border-radius: var(--radius-xs); color: var(--text-secondary); font-style: italic; }
  .diff { display: flex; flex-direction: column; gap: var(--space-1-5); }
  .diff__row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-2-5); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: var(--text-xs); }
  .diff__row code { color: var(--text-primary); }
  .diff__row--exp { background: var(--status-skipped-tint); }
  .diff__row--ok { background: var(--status-pass-tint); }
  .diff__row--act { background: var(--status-fail-tint); }
  .diff__tag { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint); width: 56px; flex: none; }
  .insp-log { margin: 0; font-family: var(--font-mono); font-size: 11px; line-height: 1.6; color: var(--text-muted); background: var(--bg-inset); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: var(--space-3); white-space: pre-wrap; }
  .inspector__foot { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-subtle); }

  /* ---------- Editor ---------- */
  .editor { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  .editor__pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor__pane--code { border-right: 1px solid var(--border-subtle); }
  .pane-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: var(--text-xs); font-weight: 600; background: var(--bg-surface); }
  .pane-head .ic { color: var(--text-muted); }
  .pane-head__spacer { flex: 1; }
  .pane-head__hint { font-family: var(--font-mono); font-size: 10px; color: var(--text-brand); background: var(--brand-tint); padding: 2px 8px; border-radius: var(--radius-pill); }
  .code { display: flex; flex: 1; overflow: auto; background: var(--bg-sunken); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; }
  .code__gutter { margin: 0; padding: var(--space-4) var(--space-2) var(--space-4) var(--space-4); color: var(--text-faint); text-align: right; user-select: none; }
  .code__body { margin: 0; padding: var(--space-4) var(--space-4) var(--space-4) var(--space-3); white-space: pre; }
  .code__line { min-height: 1.7em; }
  .y-k { color: var(--syntax-key); } .y-s { color: var(--syntax-string); } .y-n { color: var(--syntax-number); }
  .y-c { color: var(--syntax-comment); font-style: italic; } .y-p { color: var(--syntax-punct); } .y-v { color: var(--text-secondary); }
  .preview { flex: 1; overflow-y: auto; padding: var(--space-5); }
  .preview__target { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2-5); }
  .preview__target-row { display: flex; align-items: center; gap: var(--space-3); }
  .preview__target-row .k { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); width: 64px; }
  .preview__target-row .mono { font-size: var(--text-xs); color: var(--text-secondary); }
  .preview__steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); counter-reset: s; }
  .pstep { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2-5) var(--space-3); background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
  .pstep--assert { background: var(--bg-inset); }
  .pstep__n { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); width: 16px; }
  .pstep__icon { color: var(--text-muted); display: inline-flex; }
  .pstep--assert .pstep__icon { color: var(--text-brand); }
  .pstep__text { flex: 1; font-size: var(--text-sm); color: var(--text-primary); }
  .pstep__text code { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); }
  .pstep__badge { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-brand); background: var(--brand-tint); padding: 2px 7px; border-radius: var(--radius-pill); }

  /* ---------- Providers ---------- */
  .providers { padding: var(--space-6); max-width: 900px; margin: 0 auto; }
  .providers__head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-5); }
  .providers__head h2 { font-size: var(--text-2xl); font-weight: 600; letter-spacing: -0.02em; }
  .providers__sub { color: var(--text-muted); font-size: var(--text-sm); margin-top: 4px; }
  .providers__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); margin-bottom: var(--space-6); }
  .pcard { padding: var(--space-4); background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); cursor: pointer; transition: var(--transition-colors); }
  .pcard:hover { border-color: var(--border-strong); }
  .pcard.is-active { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow-sm); }
  .pcard__top { display: flex; align-items: center; gap: var(--space-3); }
  .pcard__logo { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--brand-tint); color: var(--text-brand); flex: none; }
  .pcard__id { flex: 1; min-width: 0; }
  .pcard__name { font-weight: 600; font-size: var(--text-sm); }
  .pcard__model { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .pcard__status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--font-mono); }
  .pcard__status--on { color: var(--status-pass); } .pcard__status--off { color: var(--text-faint); }
  .pcard__note { margin-top: var(--space-3); font-size: var(--text-xs); color: var(--text-muted); }
  .pcard__primary { margin-top: var(--space-2); display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--text-brand); }
  .providers__config { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
  .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); padding: var(--space-5); }
  .config-foot { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-5); border-top: 1px solid var(--border-subtle); background: var(--bg-inset); }
  .config-foot__actions { display: flex; gap: var(--space-2); }

  /* ---------- Status bar ---------- */
  .statusbar { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-4); background: var(--bg-surface); border-top: 1px solid var(--border-subtle); }
  .statusbar__group { display: flex; align-items: center; gap: var(--space-4); }
  .statusbar__item { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .statusbar__item .ic { color: var(--text-faint); }
  .statusbar__item--ok { color: var(--text-secondary); }
  .statusbar__item--fail { color: var(--status-fail); }
  .statusbar__item--muted { color: var(--text-faint); }
</style>
</head>
<body>
<div id="root"></div>
