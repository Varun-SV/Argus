# Clippy configuration for the Rust workspace. Lint levels live in [workspace.lints] in
# Cargo.toml; the minimum Rust version is read from `rust-version` there.

# Tests may use unwrap/expect/dbg: a panic is the failure report there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
