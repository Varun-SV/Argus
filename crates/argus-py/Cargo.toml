[package]
name = "argus-py"
description = "PyO3 extension module backing the documented Argus Python API (spec section 10). P0 stub; owned by the packaging work package."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
argus-core.workspace = true
pyo3.workspace = true

# argus-py is the PyO3 FFI boundary, so it cannot inherit `unsafe_code = "forbid"` from the
# workspace (Cargo does not allow overriding single inherited lints). This table repeats the
# workspace lints with `unsafe_code` relaxed to "deny": code generated by the PyO3 macros is
# exempt, and any hand-written `unsafe` block must carry an explicit, reviewed
# `#[allow(unsafe_code)]` plus a `// SAFETY:` comment (spec §14).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
