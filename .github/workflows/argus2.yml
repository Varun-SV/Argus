name: Argus 2

on:
  push:
    branches: [main]
    paths: ["argus2/**", "tests/v2/**", "pyproject.toml", ".github/workflows/argus2.yml"]
  pull_request:
    branches: [main]
    paths: ["argus2/**", "tests/v2/**", "pyproject.toml", ".github/workflows/argus2.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[app,dev]"
      - name: Install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium
          else python -m playwright install chromium; fi
      - run: python -m pytest tests/v2 -q

  bundle:
    name: App bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[app,gui]" "pyinstaller==6.22.3"
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --name Argus2
          --collect-data argus2 --collect-all playwright --collect-submodules anthropic
          --distpath build/argus2-dist --workpath build/argus2-work --specpath build/argus2-spec
          argus2/app_entry.py
      - name: Smoke test the bundle
        shell: bash
        run: |
          export ARGUS2_HOME="$RUNNER_TEMP/argus2-home"
          mkdir -p "$RUNNER_TEMP/ws"
          ./build/argus2-dist/Argus2/Argus2 --version
          ./build/argus2-dist/Argus2/Argus2 --no-open --port 8791 --workspace "$RUNNER_TEMP/ws" > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 30); do grep -q "Open: http" "$RUNNER_TEMP/app.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/app.log"
          url=$(grep -o 'http://[^ ]*' "$RUNNER_TEMP/app.log" | head -1)
          curl -fsS -c "$RUNNER_TEMP/jar" -L -o /dev/null "$url"
          curl -fsS -b "$RUNNER_TEMP/jar" http://127.0.0.1:8791/api/state | grep -q '"version"'
          curl -fsS -b "$RUNNER_TEMP/jar" http://127.0.0.1:8791/app.js | grep -q "Argus UI"
      - uses: actions/upload-artifact@v7
        with:
          name: argus2-${{ runner.os }}-${{ runner.arch }}
          path: build/argus2-dist/Argus2
          retention-days: 14
