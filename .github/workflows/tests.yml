name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality + package integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine ruff
      - name: Catch syntax and import-name mistakes
        run: |
          python -m compileall -q argus .github/scripts packaging
          ruff check argus tests .github/scripts packaging --select E9,F63,F7,F82
      - name: Build and verify Python distribution
        run: |
          python -m build
          python -m twine check dist/*

  pytest:
    name: pytest · ${{ matrix.label }} · py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            python: "3.10"
            install_args: .[dev,linux]
          - label: Linux x64
            os: ubuntu-24.04
            python: "3.12"
            install_args: .[dev,linux]
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            python: "3.12"
            install_args: .[dev,linux]
          - label: Windows x64
            os: windows-2025
            python: "3.10"
            install_args: .[dev,windows]
          - label: Windows x64
            os: windows-2025
            python: "3.12"
            install_args: .[dev,windows]
          - label: Windows ARM64
            os: windows-11-arm
            python: "3.12"
            install_args: .[dev,windows]
          - label: macOS Apple Silicon
            os: macos-15
            python: "3.12"
            install_args: .[dev]
          - label: macOS Intel
            os: macos-15-intel
            python: "3.12"
            install_args: .[dev]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Prepare Windows ARM64 OpenSSL build dependency
        if: matrix.label == 'Windows ARM64'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { throw "VCPKG_INSTALLATION_ROOT is not available on the ARM64 runner" }
          $vcpkg = Join-Path $root "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) { throw "vcpkg.exe not found at $vcpkg" }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $vcpkg install openssl:arm64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ matrix.install_args }}"
      - name: Run tests
        run: python -m pytest -q
