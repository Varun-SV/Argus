name: Automatic release on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: argus-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release tag
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'release:none')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Select semantic-version bump
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if grep -q '"bump:major"' <<<"$LABELS"; then
            echo "value=major" >> "$GITHUB_OUTPUT"
          elif grep -q '"bump:minor"' <<<"$LABELS"; then
            echo "value=minor" >> "$GITHUB_OUTPUT"
          else
            echo "value=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve idempotent release version
        id: release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BUMP: ${{ steps.bump.outputs.value }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force

          EXISTING_TAG="$(
            git tag --points-at "$MERGE_SHA" |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1 || true
          )"
          if [ -n "$EXISTING_TAG" ]; then
            echo "Reusing release tag $EXISTING_TAG already attached to this merge commit."
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "version=${EXISTING_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG="$(
            git tag --list |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1 || true
          )"
          if [ -n "$LATEST_TAG" ]; then
            CURRENT_VERSION="${LATEST_TAG#v}"
          else
            CURRENT_VERSION="0.1.0"
          fi

          python .github/scripts/next_release.py             --current "$CURRENT_VERSION"             --bump "$BUMP"
          echo "needs_tag=true" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        if: steps.release.outputs.needs_tag == 'true'
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Refusing to move existing tag $TAG" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$MERGE_SHA" -m "Argus $TAG"
          git push origin "refs/tags/$TAG"

  build:
    name: Build all release artifacts
    needs: prepare
    uses: ./.github/workflows/build-artifacts.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}

  publish-release:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 manifest
        working-directory: release-assets
        run: sha256sum * | sort -k2 > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*
      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/*               --verify-tag --title "$TAG" --generate-notes
          fi

  publish-pypi-trusted:
    name: Publish Python package to PyPI (trusted)
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-pypi-token:
    name: Publish Python package to PyPI (token fallback)
    if: vars.PYPI_TRUSTED_PUBLISHING != 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-python
          path: dist
      - name: Check token availability
        id: token
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PYPI_API_TOKEN is not configured; GitHub release will still be published."
          fi
      - if: steps.token.outputs.enabled == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  pages:
    name: Refresh hosted page
    needs: prepare
    uses: ./.github/workflows/static.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ needs.prepare.outputs.tag }}
