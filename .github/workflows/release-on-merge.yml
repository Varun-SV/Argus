name: Release on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine bump type from PR labels
        id: bump
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q "bump:major"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "bump:minor"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release (parse changelog, bump version)
        id: release
        run: |
          python .github/scripts/prepare_release.py --bump ${{ steps.bump.outputs.type }}

      - name: Commit version bump
        if: steps.release.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml
          git commit -m "chore: release v${{ steps.release.outputs.version }} [skip ci]"
          git tag "v${{ steps.release.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.release.outputs.version }}"

      - name: Create GitHub Release
        if: steps.release.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.release.outputs.version }}"
          name: "v${{ steps.release.outputs.version }}"
          body: ${{ steps.release.outputs.notes }}
          draft: false
          prerelease: false
